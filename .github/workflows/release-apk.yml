name: Release APK

# Push a tag like `v1.2.39-perf.1` and this builds the signed release APKs
# (arm64-v8a, armeabi-v7a and universal) and attaches them to a GitHub Release
# of the same name. It can also be started by hand from the Actions tab
# (workflow_dispatch); then the APKs are only uploaded as workflow artifacts
# and no release is created.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with Git LFS objects)
        uses: actions/checkout@v4
        with:
          # jniLibs/*.so and assets/*.dat are Git LFS objects -- without this the
          # checkout holds 130-byte pointer files and the APK has no native cores.
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # The ubuntu runner image ships a preinstalled SDK with ANDROID_HOME and
        # ANDROID_SDK_ROOT already pointing at it. AGP fails with "Several
        # environment variables and/or system properties contain different paths
        # to the SDK" if we point ANDROID_HOME somewhere else, so only install a
        # fresh SDK when the image has none, and keep both variables consistent.
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;35.0.0"

      - name: Drop machine-specific lines from gradle.properties
        # The committed gradle.properties carries one developer's Windows paths
        # (org.gradle.java.home=C:/...) and a local SOCKS proxy (127.0.0.1:10808).
        # Both would break a Linux CI build, so they are removed HERE ONLY --
        # the file in the repo is left untouched for local development.
        run: |
          sed -i -E '/^(org\.gradle\.jvmargs|org\.gradle\.java\.home|org\.gradle\.java\.installations\.paths|systemProp\.socksProxyHost|systemProp\.socksProxyPort|systemProp\.socksNonProxyHosts)=/d' gradle.properties
          echo 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' >> gradle.properties
          cat gradle.properties

      - name: Generate an ephemeral signing keystore
        # The release buildType has no signingConfig in the repo (release keys are
        # never committed), so CI signs with a throwaway key. The resulting APKs
        # install fine on their own; they just cannot update over an official,
        # differently-signed release.
        run: |
          keytool -genkeypair -keystore "$PWD/ci-release.keystore" -storetype PKCS12 \
            -alias mlmvpn-ci -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mlmvpn-ci -keypass mlmvpn-ci \
            -dname "CN=MLMVPN CI, OU=CI, O=MLMVPN, C=NL"
          echo "KEYSTORE_PATH=$PWD/ci-release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASS=mlmvpn-ci" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=mlmvpn-ci" >> "$GITHUB_ENV"
          echo "KEY_PASS=mlmvpn-ci" >> "$GITHUB_ENV"

      - name: Sanity-check the wrapper
        run: |
          java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --version

      - name: Build signed CI APKs (all ABIs + universal)
        # The `ci` buildType == release + applicationIdSuffix '.ci', so the APK
        # installs NEXT TO the official app (different package, CI key) instead of
        # being rejected as a signature-mismatched update of it.
        # Invoke the wrapper JAR directly rather than through gradlew: it is exactly
        # what the sanity check above already proved works on this runner.
        run: |
          set -o pipefail
          java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain \
            --no-daemon --stacktrace \
            -I scripts/ci-signing.init.gradle \
            assembleCi -x lintVitalCi 2>&1 | tee /tmp/build.log

      - name: Surface the build log as annotations (on failure)
        # Runner log downloads are not reachable from everywhere, so on failure the
        # log tail is echoed as workflow annotations -- which ARE available through
        # the plain REST API (check-runs/.../annotations) -- plus the job summary.
        if: failure()
        run: |
          echo "::error ::build.log has $(wc -l < /tmp/build.log) lines"
          grep -iE "error|exception|fail|caused by|what went wrong" /tmp/build.log | head -20 | while IFS= read -r l; do echo "::error ::$l"; done
          tail -n 45 /tmp/build.log | while IFS= read -r l; do echo "::error ::$l"; done
          { echo '### Build log tail (failure)'; echo '```'; tail -60 /tmp/build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the full build log to a draft release (on failure)
        # The release body is readable through the plain REST API, unlike the runner
        # log zip (which redirects to a host this environment cannot reach).
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          {
            echo "## Build FAILED — full log of run ${GITHUB_RUN_ID}"
            echo
            echo '```'
            head -c 60000 /tmp/build.log
            echo '```'
          } > /tmp/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --draft --title "$TAG (build failed)" --notes-file /tmp/notes.md
          fi

      - name: Collect APKs
        run: |
          mkdir -p dist/apk
          cp app/build/outputs/apk/ci/*.apk dist/apk/
          ls -la dist/apk/

      - name: Verify APK identity (package name + signing schemes)
        # The installer only offers "Install" (instead of "Update") next to the
        # official app if the APK's package really is com.mlmvpn.scanner.ci.
        # Print the real package name (aapt2 dump badging) and signing schemes
        # (apksigner verify) of every APK into /tmp/verify.txt -- the release
        # notes include it, so anyone can confirm the package before download.
        # Fails the build if any APK is NOT com.mlmvpn.scanner.ci.
        run: |
          : > /tmp/verify.txt
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "tools: AAPT2=$AAPT2 APKSIGNER=$APKSIGNER" | tee -a /tmp/verify.txt
          BAD=0
          for apk in dist/apk/*.apk; do
            echo "== $(basename "$apk")" >> /tmp/verify.txt
            PKG="$("$AAPT2" dump badging "$apk" | head -1)"
            echo "$PKG" >> /tmp/verify.txt
            case "$PKG" in
              "package: name='com.mlmvpn.scanner.ci'"*) : ;;
              *) BAD=1; echo "::error ::$(basename "$apk") has unexpected package: $PKG" ;;
            esac
            "$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1 \
              | grep -E "^(Verifies|Verified using|Number of signers|Signer .* certificate DN)" >> /tmp/verify.txt \
              || echo "apksigner verify FAILED for $(basename "$apk")" >> /tmp/verify.txt
          done
          cat /tmp/verify.txt
          if [ "$BAD" -ne 0 ]; then
            echo "::error ::at least one built APK is not com.mlmvpn.scanner.ci -- it would NOT install next to the official app"
            exit 1
          fi
          echo "OK: every built APK is package com.mlmvpn.scanner.ci"

      - name: Upload APKs as workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mlmvpn-release-apks
          path: dist/apk/*.apk

      - name: Create or update the GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE=/tmp/notes.md
          {
            echo "### ${TAG}"
            echo
            echo "Built from commit \`${GITHUB_SHA}\` (ci variant, applicationId \`com.mlmvpn.scanner.ci\`)."
            echo "Installs NEXT TO the official MLM VPN app — the official key is not in this repo, so a same-package build could never update over it. Signed with the stable CI key (ci/ci-release.keystore), so the in-app updater can update one CI build over the previous one."
            echo
            echo "APKs: arm64-v8a, armeabi-v7a and universal."
            echo
            echo "---"
            echo
            sed -n '/^## \[Unreleased\]/,/^## \[1\.2\.39\]/p' CHANGELOG.md | sed '$d'
            if [ -f /tmp/verify.txt ]; then
              echo
              echo "### APK identity check (aapt2 dump badging / apksigner verify)"
              echo '```'
              cat /tmp/verify.txt
              echo '```'
            fi
          } > "$NOTES_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
            gh release upload "$TAG" dist/apk/*.apk --clobber
          else
            gh release create "$TAG" dist/apk/*.apk --title "$TAG" --notes-file "$NOTES_FILE"
          fi
          # A failed earlier attempt may have left the release as a draft named
          # "(build failed)" -- publish it properly now that the build succeeded.
          REL_ID=$(gh release view "$TAG" --json id --jq '.id' 2>/dev/null || true)
          if [ -n "$REL_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$REL_ID" \
              --field draft=false --field name="$TAG" >/dev/null || true
          fi
