// MLM CHAT core for Android (PLAN 14.2): the Kotlin API over the Rust core (android/jni), with no
// UI and nothing from any host app in it. Apache-2.0. The native library is built into
// src/main/jniLibs by scripts/build-native.sh; it is a build output and not kept in git.
plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'org.mlmchat.core'
    compileSdk 36

    defaultConfig {
        // The lowest of the hosts: the Telegram fork's module asks for 23.
        minSdk 23
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
