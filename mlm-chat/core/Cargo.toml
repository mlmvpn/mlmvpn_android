[package]
name = "mlmchat-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "MLM CHAT core: identity, contact cards, Olm sessions, envelopes, sealed frames, queue, encrypted store, transports"
publish = false

# No hand-made cryptography (CLAUDE.md, T18). Every primitive comes from a library:
#   vodozemac  - Olm (3DH + Double Ratchet), Ed25519 signatures of the identity
#   hpke       - RFC 9180 sealing (SealedFrame), the same crate and suite vodozemac uses
#   snow       - Noise for the SPEC 14.7 session (direct transport and p2p streams)
#   libp2p     - the p2p transport (T11): Noise XX, Yamux, Kademlia, Circuit Relay v2, DCUtR
#   chacha20poly1305 - XChaCha20-Poly1305 of the presence record (SPEC 8) and STREAM of files (SPEC 17)
#   blake3     - the id of a sealed file (SPEC 5 `Media.blob_id`)
#   rustls (aws-lc-rs) - TLS 1.3 under every p2p connection, X25519MLKEM768 first (SPEC 15.3)
#   SQLCipher  - the encrypted database (built from sqlcipher-src, see build.rs)
#   sha2/hmac/hkdf - the published constructions the SPEC names (security number, beacons)
#   httparse, webpki-roots - the Google mailbox relay's HTTPS client (SPEC 19): the standard web roots

[lib]
name = "mlmchat_core"
path = "src/lib.rs"

[[bin]]
name = "peer-cli"
path = "src/bin/peer-cli.rs"

[dependencies]
base64 = "0.23.1"
blake3 = "1.8"
chacha20poly1305 = { version = "0.10.1", features = ["stream"] }
futures = "0.3"
futures-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
httparse = "1.10"
hmac = "0.13.0"
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
# Nostr events' BIP-340 signatures (SPEC 20, T52): only what relays need to take an event
k256 = { version = "0.13.4", default-features = false, features = ["schnorr", "std"] }
libp2p = { version = "0.56", default-features = false, features = [
    "tokio", "tcp", "noise", "yamux", "kad", "relay", "dcutr", "identify", "ping", "macros",
] }
libp2p-stream = "0.4.0-alpha"
log = "0.4.34"
minicbor = { version = "2.3.1", features = ["std"] }
prost = "0.14.4"
qrcode = { version = "0.14.1", default-features = false }
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["sqlcipher", "modern_sqlite"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
snow = "0.10.0"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
vodozemac = "0.11.1"
webpki-roots = "1"
zeroize = "1.9.1"
netdev = { version = "0.46", default-features = false, features = ["gateway"] }

[target.'cfg(unix)'.dependencies]
# getifaddrs: Android 11+ denies apps the link list netdev reads (transport/lan.rs)
libc = "0.2"

[build-dependencies]
cc = "1.9.0"
sqlcipher-src = "419.0.6"

[dev-dependencies]
ed25519-dalek = "3.0.0"
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
