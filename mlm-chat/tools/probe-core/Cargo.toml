[package]
name = "probe-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "MLM CHAT phase-0 network probe: the measurements the phone runs and the observer they talk to"
publish = false

# One crate, two users: tools/netprobe/native (the phone, through JNI) and tools/observer (the
# home PC). Every byte either of them sends is encrypted (decision T18): Noise NK for the
# phone <-> observer channel, TLS 1.3 with a pinned certificate for phone <-> phone over TCP,
# QUIC (TLS 1.3 inside) for phone <-> phone over UDP. No hand-made cryptography: snow, rustls,
# quinn and ring do all of it.

[lib]
name = "probe_core"
path = "src/lib.rs"

[[bin]]
name = "probe-cli"
path = "src/bin/probe-cli.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
if-addrs = "0.13"
igd-next = { version = "0.16", default-features = false, features = ["aio_tokio"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.9"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
