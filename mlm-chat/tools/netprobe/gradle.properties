# -Djdk.net.unixdomain.tmpdir: this machine's TEMP is an 8.3 short path where Windows cannot
# connect AF_UNIX sockets ("Unable to establish loopback connection"). build-netprobe.ps1 also
# points TEMP/TMP at C:\gradle-tmp for the daemon it forks. No SOCKS proxy lines on purpose.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Djdk.net.unixdomain.tmpdir=C:\\gradle-tmp
org.gradle.java.home=C\:/Program Files/Android/Android Studio/jbr
android.useAndroidX=false
android.suppressUnsupportedCompileSdk=35
