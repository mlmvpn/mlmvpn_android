[package]
name = "mlm-observer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "MLM CHAT phase-0 observer: NAT observer and hole-punch introducer for a home PC"
publish = false

[[bin]]
name = "mlm-observer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
igd-next = { version = "0.16", default-features = false, features = ["aio_tokio"] }
probe-core = { path = "../probe-core" }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Phase-0 spikes (PLAN section 17.2): the libp2p relay and the iroh relay + hub run here too.
spike-libp2p = { path = "../spike-libp2p" }
spike-iroh = { path = "../spike-iroh", features = ["relay-server"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
