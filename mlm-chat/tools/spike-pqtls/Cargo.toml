[package]
name = "spike-pqtls"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "MLM CHAT phase 0 (PLAN 17.3): cost of TLS 1.3 with the hybrid post-quantum key exchange on a phone"
publish = false

[lib]
name = "spike_pqtls"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "spike-pqtls"
path = "src/bin/spike-pqtls.rs"

[dependencies]
jni = { version = "0.21", default-features = false }
# aws-lc-rs is the rustls provider that has X25519MLKEM768; ring does not.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
