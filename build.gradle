buildscript {
    ext.kotlin_version = '2.1.0'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // AGP 8.13 and Kotlin 2.1: the toolchain the Telegram fork (MLM CHAT, T4/T23) is built
        // with. AGP 8.13 bundles an R8 that reads Kotlin 2.x metadata, so the old R8 override
        // (needed under AGP 8.3.2 for okhttp 5.1 / okio 3.15 from amneziawg) is gone.
        classpath "com.android.tools.build:gradle:8.13.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // Since Kotlin 2.0 the Compose compiler ships with Kotlin, as this Gradle plugin.
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}

allprojects {
}

task clean(type: Delete) {
    delete rootProject.buildDir
}