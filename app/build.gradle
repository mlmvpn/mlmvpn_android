plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.mlmvpn.scanner'
    compileSdk 34
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.mlmvpn.scanner"
        minSdk 24
        targetSdk 34
        versionCode 59
        versionName "1.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Force extraction of native libraries so standalone .so binaries
        // (like libgst-core.so) are accessible via nativeLibraryDir
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            // R8: shrink unused library code (keeps all app code + native core).
            // shrinkResources left off — res is tiny and dynamic lookups exist.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        // libv2ray.aar (new) bundles okhttp compiled with a newer Kotlin metadata (2.2)
        // than our compiler (1.9). This lets 1.9 read those classes instead of erroring.
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
}

dependencies {

    implementation 'com.google.code.gson:gson:2.10.1'
    
    constraints {
        implementation("androidx.core:core-ktx") {
            version { strictly("1.13.1") }
            because("prevent amneziawg from pulling 1.17.0 which requires compileSdk 36")
        }
        implementation("androidx.core:core") {
            version { strictly("1.13.1") }
            because("prevent amneziawg from pulling 1.17.0 which requires compileSdk 36")
        }
        // io.github.tim06:openvpn asks for lifecycle 2.8.2. Left alone that one bump
        // cascades across the whole app: lifecycle 2.7.0 -> 2.8.2 drags compose-runtime
        // 1.5.4 -> 1.6.5 (past our compose compiler extension 1.5.10) and lifecycle-process
        // -> emoji2 1.4.0 -> appcompat 1.7.1 -> material 1.12.0. The VPN Gate feature only
        // needs LifecycleService, which 2.7.0 already has, so pin the whole atomic group and
        // leave every other engine's dependency graph exactly as it was.
        [
            "lifecycle-runtime", "lifecycle-runtime-ktx", "lifecycle-runtime-compose",
            "lifecycle-common", "lifecycle-common-java8", "lifecycle-process",
            "lifecycle-livedata", "lifecycle-livedata-core", "lifecycle-livedata-core-ktx",
            "lifecycle-livedata-ktx", "lifecycle-service",
            "lifecycle-viewmodel", "lifecycle-viewmodel-ktx", "lifecycle-viewmodel-savedstate",
        ].each { artifact ->
            implementation("androidx.lifecycle:$artifact") {
                version { strictly("2.7.0") }
                because("prevent io.github.tim06:openvpn from bumping the androidx.lifecycle " +
                        "group to 2.8.2, which cascades into compose-runtime/appcompat/material")
            }
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib") {
            version { strictly("1.9.22") }
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8") {
            version { strictly("1.9.22") }
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7") {
            version { strictly("1.9.22") }
        }
    }
    
    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Lifecycle & ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'

    // Jetpack Compose
    def compose_bom = platform('androidx.compose:compose-bom:2023.10.01')
    implementation compose_bom
    androidTestImplementation compose_bom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Networking (OkHttp for Cloudflare API)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Google Sign-In + OAuth token (for Apps Script REST API auto-deploy)
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // JSON parsing
    implementation 'org.json:json:20231013'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // Fragment
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // Preferences (Encrypted storage for API tokens)
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // ZXing for QR Code generation and scanning
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Xray/V2ray Core
    implementation files('libs/libv2ray.aar')
    
    // AmneziaWG Core
    implementation 'com.zaneschepke:amneziawg-android:2.1.13'

    // OpenVPN Core (openvpn3 via JNI) — used only by the VPN Gate feature.
    // Runs OpenVPNService in its own ":openvpn" process, so it cannot disturb
    // MyVpnService or any other engine.
    implementation 'io.github.tim06:openvpn:1.1.3'
    implementation 'io.github.tim06:vpnprotocolsnotification:1.1.0'

}
