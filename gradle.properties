# -Djdk.net.unixdomain.tmpdir: the JDK opens every NIO Selector over an AF_UNIX socket pair
# placed in the temp dir. This machine's TEMP resolves to the 8.3 short form
# (C:\Users\EHSANC~1\...), and Windows can bind such a socket but NOT connect to it, so every
# Gradle invocation died with "java.io.IOException: Unable to establish loopback connection"
# before it ran a single task. Pointing the JDK at a plain long path fixes it.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Djdk.net.unixdomain.tmpdir=C:\\gradle-tmp
# No SOCKS proxy (24 Oct 2026): 127.0.0.1:10808 had nothing listening, so every download Android
# Studio made failed in a few milliseconds (sources jars, Gradle's own poms), while the same files
# came straight through the PC's tunnel. Put these back only with a proxy that is really running.
#systemProp.socksProxyHost=127.0.0.1
#systemProp.socksProxyPort=10808
#systemProp.socksNonProxyHosts=localhost|127.0.0.1|[::1]
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=34,35
org.gradle.java.home=C\:/Program Files/Android/Android Studio/jbr
org.gradle.java.installations.paths=C\:/Program Files/Android/Android Studio/jbr
