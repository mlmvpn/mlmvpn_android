// CI-only signing injection. The release buildType deliberately has NO
// signingConfig in the repo (release keys are never committed), so an unsigned
// APK is what `assembleRelease` produces locally. This init script signs it with
// an ephemeral keystore passed through environment variables:
//
//   ./gradlew -I scripts/ci-signing.init.gradle assembleRelease
//
// with KEYSTORE_PATH / KEYSTORE_PASS / KEY_ALIAS / KEY_PASS set (see
// .github/workflows/release-apk.yml). Without KEYSTORE_PATH the script does
// nothing, so local builds behave exactly as before.
//
// Written with explicit container APIs (maybeCreate / getByName) rather than the
// DSL closure form: inside an init script the closure delegate resolves against
// the project first, and `signingConfigs { ... }` then fails with
// "Could not find method signingConfigs() ... on project ':app'" during
// configuration -- which is exactly how the first CI attempt died.
allprojects { p ->
    p.afterEvaluate {
        if (p.plugins.hasPlugin('com.android.application')) {
            def ks = System.getenv('KEYSTORE_PATH')
            if (ks != null && new File(ks).isFile()) {
                def androidExt = p.extensions.getByName('android')
                def sc = androidExt.signingConfigs.maybeCreate('release')
                sc.storeFile = p.file(ks)
                sc.storePassword = System.getenv('KEYSTORE_PASS')
                sc.keyAlias = System.getenv('KEY_ALIAS')
                sc.keyPassword = System.getenv('KEY_PASS')
                // targetSdk is 34: Android 11+ refuses APKs without scheme v2+,
                // so make all schemes explicit instead of relying on defaults.
                // (AGP 8.3 names: enableV1Signing / enableV2Signing / enableV3Signing.)
                sc.enableV1Signing = true
                sc.enableV2Signing = true
                sc.enableV3Signing = true
                // Sign every non-debug buildType (release and the ci variant); debug
                // keeps its own debug key.
                ['release', 'ci'].each { name ->
                    def bt = androidExt.buildTypes.findByName(name)
                    if (bt != null) bt.signingConfig = sc
                }
            }
        }
    }
}
