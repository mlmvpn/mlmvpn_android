// CI-only signing injection. The release buildType deliberately has NO
// signingConfig in the repo (release keys are never committed), so an unsigned
// APK is what `assembleRelease` produces locally. This init script signs it with
// an ephemeral keystore passed through environment variables:
//
//   ./gradlew -I scripts/ci-signing.init.gradle assembleRelease
//
// with KEYSTORE_PATH / KEYSTORE_PASS / KEY_ALIAS / KEY_PASS set (see
// .github/workflows/release-apk.yml). Without KEYSTORE_PATH the script does
// nothing, so local builds behave exactly as before.
//
// The configuration goes through extensions.configure('android') rather than
// property access: that is the form which creates the signingConfigs.release
// element if AGP has not made it yet, so it cannot throw UnknownDomainObject
// during project configuration.
allprojects { p ->
    p.afterEvaluate {
        if (p.plugins.hasPlugin('com.android.application')) {
            def ks = System.getenv('KEYSTORE_PATH')
            if (ks != null && new File(ks).isFile()) {
                p.extensions.configure('android') {
                    signingConfigs {
                        release {
                            storeFile = p.file(ks)
                            storePassword = System.getenv('KEYSTORE_PASS')
                            keyAlias = System.getenv('KEY_ALIAS')
                            keyPassword = System.getenv('KEY_PASS')
                        }
                    }
                    buildTypes {
                        release {
                            signingConfig = signingConfigs.release
                        }
                    }
                }
            }
        }
    }
}
